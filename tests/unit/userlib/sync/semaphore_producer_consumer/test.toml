[test]
name = "test_semaphore_producer_consumer"
layer = 6
kind = "integration"
source = "test_semaphore_producer_consumer.cpp"
config = "test_semaphore_producer_consumer_config.hpp"

[components]
# No port filter since 2026-09-25: passes on both ports, and the coop run is
# the one ThreadSanitizer can instrument (build/toolchains/gcc-tsan.toml).
time_driver = "tickless"
features = ["sync"]

[link]
system_libraries = ["boost_context", "gtest", "gtest_main"]
