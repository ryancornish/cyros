[test]
name = "test_cortex_m33_smp_idle"
layer = 8

# Several layers together (each core's idle loop, its WFI, its own SysTick and
# chrono's sleep) under real interrupt timing, so integration. Layer 8 because
# sleeping is chrono.
kind = "integration"
source = "test_cortex_m33_smp_idle.cpp"
config = "test_cortex_m33_smp_idle_config.hpp"

# Runs on bare metal, on the machine the toolchain's board and runner name.
# Skipped by every hosted profile.
hosted = false

[components]
port = "cortex_m33_smp"
time_driver = "periodic"
features = ["chrono", "sync"]

[link]
system_libraries = []

# Every call the kernel makes to cyros_port_idle reaches the test's
# __wrap_cyros_port_idle first, which counts it per core (see the source).
flags = ["-Wl,--wrap=cyros_port_idle"]
