[test]
name = "test_cortex_m_fpu"
layer = 2
kind = "unit"
source = "test_cortex_m_fpu.cpp"
config = "test_cortex_m_fpu_config.hpp"

# Runs on bare metal, on the machine the toolchain's board and runner name.
# Skipped by every hosted profile.
hosted = false

# Its subject is the FP save, and its asm is VFP, so it neither means anything
# nor compiles without an FPU. Skipped by a toolchain that does not provide one
# (the soft-float Cortex-M3's).
requires = ["fpu"]

[components]
port = ["cortex_m", "rp2350_m33"]

[link]
system_libraries = []
