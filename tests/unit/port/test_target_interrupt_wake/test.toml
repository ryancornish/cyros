[test]
name = "test_target_interrupt_wake"
layer = 5
kind = "unit"
source = "test_target_interrupt_wake.cpp"
config = "test_target_interrupt_wake_config.hpp"

# Runs on bare metal, on the machine the toolchain's board and runner name.
# Skipped by every hosted profile. linux_preempt has its twin,
# test_singlecore_interrupt_wake.
hosted = false

[components]
port = ["cortex_m", "cortex_m0", "riscv_virt", "rp2350_hazard3", "rp2350_m33", "rp2040", "cortex_r52", "leon3"]
time_driver = "periodic"

[link]
system_libraries = []
