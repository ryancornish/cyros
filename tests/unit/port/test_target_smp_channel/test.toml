[test]
name = "test_target_smp_channel"
layer = 7
kind = "unit"
source = "test_target_smp_channel.cpp"
config = "test_target_smp_channel_config.hpp"

# Runs on bare metal, on the machine the toolchain's board and runner name.
# Skipped by every hosted profile.
hosted = false

[components]
port = ["cortex_m33_smp", "riscv_virt_smp", "rp2350_hazard3_smp", "rp2350_m33_smp"]
time_driver = "periodic"
features = ["sync", "channel"]

[link]
system_libraries = []
