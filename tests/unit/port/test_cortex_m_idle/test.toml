[test]
name = "test_cortex_m_idle"
layer = 8

# Several layers together (the idle loop, the port's WFI, the time driver's
# interrupt and chrono's sleep) under real interrupt timing, so integration.
# Layer 8 because sleeping is chrono, and it trusts everything below.
kind = "integration"
source = "test_cortex_m_idle.cpp"
config = "test_cortex_m_idle_config.hpp"

# Runs on bare metal, on the machine the toolchain's board and runner name.
# Skipped by every hosted profile.
hosted = false

[components]
port = "cortex_m"
time_driver = "periodic"
features = ["chrono", "sync"]

[link]
system_libraries = []

# Every call the kernel makes to cyros_port_idle reaches the test's
# __wrap_cyros_port_idle first, which is how idle is observed (see the source).
flags = ["-Wl,--wrap=cyros_port_idle"]
