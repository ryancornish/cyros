[test]
name = "test_target_device_irq"
layer = 6
kind = "unit"
source = "test_target_device_irq.cpp"
config = "test_target_device_irq_config.hpp"

# Runs on bare metal, on the board the toolchain names: it uses the RP2350's
# TIMER0, so the QEMU machines have nothing to run it on.
hosted = false

[components]
port = ["rp2350_m33", "rp2350_hazard3"]
time_driver = "periodic"
features = ["sync"]

[link]
system_libraries = []
