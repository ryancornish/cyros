[test]
name = "test_target_idle_tickless"
layer = 8

# test_target_idle's source, against the tickless driver. The config header
# is what tells the shared source which driver it has.
kind = "integration"
source = "../test_target_idle/test_target_idle.cpp"
config = "test_target_idle_tickless_config.hpp"

# Runs on bare metal, on the machine the toolchain's board and runner name.
# Skipped by every hosted profile.
hosted = false

[components]
port = ["cortex_m", "riscv_virt", "rp2350_hazard3", "rp2350_m33"]
time_driver = "tickless"
features = ["chrono", "sync"]

[link]
system_libraries = []

# As test_target_idle: the test observes idle through this wrap.
flags = ["-Wl,--wrap=cyros_port_idle"]
