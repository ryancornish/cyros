# OpenOCD for the NUCLEO-U575ZI-Q (STM32U575ZIT6Q, ST-LINK/V3E on board).
#
# The board's debug probe is an ST-LINK/V3E behind the same USB connector that
# powers it, so there is nothing to wire.
#
# STM32U5 support needs OpenOCD 0.12 or newer. An older one will not know this
# target and says so clearly rather than doing something odd.
#
# stlink-DAP, not stlink. The two configs select different DRIVERS, and only one
# of them can reach this part properly:
#
#   interface/stlink.cfg       the HLA driver. Offers hla_swd only, and hides
#                              the DAP behind ST-LINK's own command set
#   interface/stlink-dap.cfg   the dapdirect driver. Offers dapdirect_swd, real
#                              CoreSight DAP access
#
# The U5 is an ARMv8-M part with a multi-AP debug topology (secure and
# non-secure), which HLA cannot express. Asking for dapdirect_swd after sourcing
# the HLA config fails outright with "Debug adapter doesn't support
# 'dapdirect_swd' transport", which is the error to recognise if this is ever
# edited back.
source [find interface/stlink-dap.cfg]

transport select dapdirect_swd

source [find target/stm32u5x.cfg]

# Semihosting is how the image talks: the same BKPT 0xAB channel the QEMU bench
# uses, so tests/unit/common/arm/bench.hpp works unchanged on silicon. Enabled
# after `init` in the scripts below, because it needs a target.
#
# Deliberately NOT set here: anything touching option bytes. TZEN, RDP and the
# boot configuration are all one-way enough to be worth never automating.

# Semihosting, armed by a target EVENT rather than a command.
#
# `arm semihosting enable` needs an examined target, so it cannot be a config
# stage `-c`. Binding it to examine-end makes it independent of WHO drives
# OpenOCD and in what order: the shell scripts here, and an IDE that owns its
# own init and reset sequence, both end up with it on. Enabling twice is
# harmless, so the scripts may still say it explicitly.
$_TARGETNAME configure -event examine-end {
   arm semihosting enable
}
