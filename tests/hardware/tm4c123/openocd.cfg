# OpenOCD for the EK-TM4C123GXL (TM4C123GH6PM, Stellaris ICDI on board).
#
# The board's debug probe is the ICDI behind the same USB connector that powers
# it (the DEBUG port, with the power switch on DEBUG), so there is nothing to
# wire. The ICDI speaks JTAG only and cannot drive SRST, so "Error: SRST error"
# on every connect is harmless: `reset halt` still performs a full system reset.
source [find board/ti_ek-tm4c123gxl.cfg]

# Semihosting carries only a port panic here, the console being UART0, and is
# armed by a target EVENT rather than a command for the U575's reason: it needs
# an examined target, and an event works whoever drives OpenOCD.
$_TARGETNAME configure -event examine-end {
   arm semihosting enable
}
