name = "gcc-basic"

[tools]
cc = "gcc-16"
cxx = "g++-16"
ar = "gcc-ar-16"
asm = "gcc-16"

[flags]
common = []
c = ["-std=c23", "-Wall", "-Wextra", "-Wpedantic"]
cxx = ["-std=gnu++26", "-Wall", "-Wextra", "-Wpedantic"]
asm = []
link = []

[settings]
family = "gcc"
debug = false
optimization = "0"
warnings_as_errors = false
