[consumer]
name = "empty_main"
layer = 9
kind = "integration"

# Links the archive and starts nothing. Proves the library can be linked at all, which is a different claim from the library working.
script = "build.sh"
binary = "out/bin/main"

[components]
# A filter, exactly as in a unit test's test.toml: this project builds its own
# profile with its own port, so it only runs in the suite for that port rather
# than being built twice identically.
port = "linux_coop"
