name = "gcc-basic"

[tools]
cc = "gcc-16"
cxx = "g++-16"
ar = "gcc-ar-16"
asm = "gcc-16"

[flags]
common = ["-O0", "-g3"]
c = ["-std=c23", "-Wall", "-Wextra", "-Wpedantic"]
cxx = ["-std=gnu++23", "-Wall", "-Wextra", "-Wpedantic"]
asm = []
link = []

[settings]
family = "gcc"
debug = true
optimization = "0"
warnings_as_errors = false
