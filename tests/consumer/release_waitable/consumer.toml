[components]
# A filter, exactly as in a unit test's test.toml: this project builds its own
# profile with its own port, so it only runs in the suite for that port rather
# than being built twice identically.
port = "linux_preempt"

[consumer]
binary = "out/bin/main"
kind = "integration"
layer = 9
name = "release_waitable"

# An application's own waitable, linked against a RELEASE archive. The only consumer of the lto_merged archive with hidden symbols made local.
script = "build.sh"
