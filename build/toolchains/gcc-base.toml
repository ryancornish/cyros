name = "gcc-base"

[tools]
cc = "gcc-16"
cxx = "g++-16"
ar = "gcc-ar-16"
asm = "gcc-16"

[flags]
common = []
c = ["-std=gnu23", "-Wall", "-Werror", "-Wextra", "-Wpedantic", "-fno-exceptions"]
cxx = ["-std=gnu++26", "-Wall", "-Werror", "-Wextra", "-Wpedantic", "-fno-exceptions"]
asm = []
link = []

[settings]
family = "gcc"
debug = false
optimization = "0"
warnings_as_errors = false
