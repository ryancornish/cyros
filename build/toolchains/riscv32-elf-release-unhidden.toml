name = "riscv32-elf-release-unhidden"
extends = "riscv32-elf-release.toml"

# The release build with its symbols left global: the same -O2 and LTO code,
# for running the on-target suites against what the release ships, on QEMU's
# virt. The tests reach past the public API into the port, which the shipped
# archive rightly refuses, so they cannot link against it.
#
# test_target_idle and test_target_idle_tickless FAIL here by construction,
# as on arm-none-eabi-release-unhidden.toml: they wrap cyros_port_idle at link
# time, and LTO inlines it into the idle loop inside the merged archive.
[archive]
localize_hidden = false
