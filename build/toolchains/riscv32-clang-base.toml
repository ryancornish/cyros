name = "riscv32-clang-base"

# A BRIDGE, not the toolchain the RISC-V port wants. cyros needs GCC 16's
# libstdc++ (std::function_ref, std::inplace_vector) and the only RISC-V GCC on
# the machine is riscv64-elf-gcc 15.2, with no newlib (measured 2026-10-10,
# ~/cyros-claude/riscv-port-plan.md 2). So clang 22 compiles for rv32, reading
# the ARM toolchain's newlib and libstdc++ 16 HEADERS (portable text, nothing
# of theirs is linked), and GNU riscv64-elf-ld links with GCC 15's rv32imac
# libgcc. When a RISC-V GCC 16 with newlib exists, this file is replaced by a
# riscv-elf-gcc one and nothing else changes.
#
# Machine-specific: the header and libgcc paths are this Arch box's packages.

[tools]
cc = "clang"
cxx = "clang++"
ar = "riscv64-elf-ar"
asm = "clang"
objcopy = "riscv64-elf-objcopy"

# RV32IMAC in machine mode, as QEMU's virt runs it and the RP2350's Hazard3 is.
# Three clang-only warnings are silenced HERE, never in cyros: a braced scalar
# initialiser GCC accepts (spinlock.hpp), a function that tracing-off builds
# leave unused (trace.cpp), and a deprecation raised inside libstdc++'s own
# inplace_vector when clang instantiates it.
[flags]
common = [
   "--target=riscv32-unknown-elf",
   "-march=rv32imac_zicsr_zifencei",
   "-mabi=ilp32",
   "-mcmodel=medany",
   "-ffunction-sections",
   "-fdata-sections",
   "-nostdinc++",
   "-nostdlibinc",
   "-isystem", "/usr/arm-none-eabi/include/c++/16.2.0",
   "-isystem", "/usr/arm-none-eabi/include/c++/16.2.0/arm-none-eabi",
   "-isystem", "/usr/arm-none-eabi/include",
]
c = ["-std=gnu23", "-Wall", "-Werror", "-Wextra", "-Wpedantic", "-fno-exceptions"]
cxx = [
   "-std=gnu++26",
   "-Wall",
   "-Werror",
   "-Wextra",
   "-Wpedantic",
   "-fno-exceptions",
   "-fno-rtti",
   "-Wno-braced-scalar-init",
   "-Wno-unneeded-internal-declaration",
   "-Wno-deprecated-declarations",
]
asm = []

# No C library at all (-nolibc): the board supplies memset and friends. clang
# appends libgcc AFTER the objects, which a plain -lgcc here would not.
link = [
   "-nostartfiles",
   "-nostdlib++",
   "-nolibc",
   "-rtlib=libgcc",
   "-fuse-ld=bfd",
   "--ld-path=/usr/bin/riscv64-elf-ld",
   "-L/usr/lib/gcc/riscv64-elf/15.2.0/rv32imac/ilp32",
   "-Wl,--gc-sections",
   "-Wl,--no-warn-rwx-segments",
]

[settings]
family = "clang"
debug = false
optimization = "0"
warnings_as_errors = false
hosted = false
provides = []

[board]
linker_script = "../../tests/unit/port/riscv_bench/riscv_virt.ld"
sources = [
   "../../tests/unit/port/riscv_bench/startup_riscv_virt.c",
   "../../tests/unit/port/riscv_bench/runtime_stubs.c",
]

[runner]
command = [
   "qemu-system-riscv32",
   "-M", "virt",
   "-bios", "none",
   "-nographic",
   "-semihosting-config", "enable=on,target=native",
   "-kernel", "{binary}",
]
timeout = 30
