name = "port"
kind = "port"

variants = [
   "linux_coop",
   "linux_preempt",
   "cortex_m33",
]

# port.h and port_time.h are the KERNEL-to-port contract, not a public API. They
# are an include root rather than public headers: the kernel and the ports
# compile against them in place, and nothing is copied into the exported tree,
# so a consumer of libcyros.a cannot reach them at all. See
# ~/cyros-claude/port-internal-proposal.md.
internal_include_roots = ["internal_headers"]
