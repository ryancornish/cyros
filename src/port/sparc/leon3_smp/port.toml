name = "leon3_smp"

description = "Several GRLIB LEON3s: QEMU's leon3_generic with -smp. The IRQMP's force registers as the IPI, one GPTIMER compare shared."

extends = "sparcv8"

# leon3's machine code, which handles any number of cores, and the MTIME time
# source. Only port_traits.h differs.
sources = [
   "../leon3/port_mcu_leon3.cpp",
   "../../common/port_time_mtime.cpp",
]

private_includes = ["../../common"]

public_headers = [
   "public_headers/port_traits.h -> cyros/port/port_traits.h",
]
