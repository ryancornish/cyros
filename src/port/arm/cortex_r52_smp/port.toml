name = "cortex_r52_smp"

description = "Two Cortex-R52s: QEMU's mps3-an536 with -smp 2. SGI 0 as the IPI, the shared generic timer."

extends = "armv8r"

# cortex_r52's machine code, which handles any number of cores, and the MTIME
# time source. Only port_traits.h differs.
sources = [
   "../cortex_r52/port_mcu_cortex_r52.cpp",
   "../../common/port_time_mtime.cpp",
]

private_includes = ["../../common"]

public_headers = [
   "public_headers/port_traits.h -> cyros/port/port_traits.h",
]
