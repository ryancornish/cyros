name = "cortex_r52"

description = "A Cortex-R52, one core: QEMU's mps3-an536. The generic timer as MTIME."

extends = "armv8r"

# The identity trio, and the MTIME time source on the generic timer, which is
# shared with the RISC-V and RP2350 targets and lives in src/port/common.
sources = [
   "port_mcu_cortex_r52.cpp",
   "../../common/port_time_mtime.cpp",
]

private_includes = ["../../common"]

public_headers = [
   "public_headers/port_traits.h -> cyros/port/port_traits.h",
]
