name = "armv8m"
description = "ARMv8-M Mainline CORE LAYER. Not selectable: targets extend it."

# Deliberately absent from port/component.toml `variants`, which is what makes
# this a layer rather than a port. It implements port_core.h and nothing else,
# so on its own it would link with the whole of port_mcu.h missing. A target
# variant names it with `extends` and supplies the other half.
sources = [
   "port_core_armv8m.cpp",
]

# So that a target extending this layer can reach cortex_m.hpp. `extends` unions
# private_includes, which is the mechanism that makes a shared core header
# usable from the MCU layer without either tree reaching into the other by
# relative path.
private_includes = ["."]
